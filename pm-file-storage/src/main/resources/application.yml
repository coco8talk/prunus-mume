spring:
  application:
    name: pm-file-storage
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        namespace: ${NACOS_NAMESPACE:public}
  config:
    import:
      - nacos:pm-common.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:pm-file-storage.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true