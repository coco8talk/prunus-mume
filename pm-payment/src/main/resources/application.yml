spring:
  application:
    name: pm-payment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        namespace: ${NACOS_NAMESPACE:}
  config:
    import:
      - nacos:pm-common.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - nacos:pm-payment.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  datasource:
    password: ${coco8talk.datasource.password:}

coco8talk:
  # workId 是雪花算法工作节点号：同服务多实例必须互不相同，绝不能作为 Nacos 共享配置统一下发，否则多实例 ID 会撞车
  snowflake:
    workId: ${SNOWFLAKE_WORK_ID:0}
  alipay:
    alipayPublicKey: ${ALIPAY_PUBLIC_KEY:}
    privateKey: ${ALIPAY_PRIVATE_KEY:}
